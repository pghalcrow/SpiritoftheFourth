<main class="admin-login-shell">
  <form class="admin-login-card" (ngSubmit)="submit()">
    <p class="login-eyebrow">CMS Access</p>
    <h2>Set Password</h2>

    <label class="password-field">
      <span>Email</span>
      <input type="email" name="resetEmail" [(ngModel)]="email" autocomplete="email" required />
    </label>

    <label class="password-field">
      <span>Reset Code</span>
      <input type="text" name="resetCode" [(ngModel)]="code" autocomplete="one-time-code" required />
    </label>

    <label class="password-field">
      <span>New Password</span>
      <input type="password" name="newPassword" [(ngModel)]="password" autocomplete="new-password" required />
    </label>

    <label class="password-field">
      <span>Repeat Password</span>
      <input type="password" name="confirmPassword" [(ngModel)]="confirmPassword" autocomplete="new-password" required />
    </label>

    <p class="password-rule">Use at least 7 characters and include at least one number.</p>

    <button type="submit" class="login-button" [disabled]="isLoading">
      {{ isLoading ? 'Saving...' : 'Save Password' }}
    </button>
    <p *ngIf="infoMessage" class="login-info">{{ infoMessage }}</p>
    <p *ngIf="errorMessage" class="login-error">{{ errorMessage }}</p>
  </form>
</main>
